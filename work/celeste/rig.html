<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Céleste rig</title>
<style>
  html,body{margin:0;height:100%;background:#eeeeea;font:13px/1.4 system-ui,sans-serif;color:#111;overflow:hidden}
  #c{display:block;height:100vh;width:auto;margin:0 auto;touch-action:none}
  #ui{position:fixed;left:12px;bottom:12px;background:#fffc;padding:8px 10px;border:1px solid #111}
  #ui input{width:160px;vertical-align:middle}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">단계 <input id="stage" type="range" min="0" max="1" step="0.001" value="1"> <span id="sv">1.00</span>
  표정 <select id="ex"><option value="">기본</option><option value="smile">완주(미소)</option><option value="frown">포기(찡그림)</option></select></div>
<script>
// Céleste 리깅 시제품: 몸(고정) 위에 머리카락 다발·귀걸이 레이어를 따로 움직인다
const PARTS = 'parts/';
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {premultipliedAlpha:true, alpha:true, antialias:true});
const sm = (a,b,x)=>{ const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
let META, L, IW, IH, EXPR = '';

// 레이어별 움직임 설정
const HAIR = { hairO:{amp:30, w:1.00, ph:0.0}, hairR:{amp:15, w:1.25, ph:1.3}, hairL:{amp:26, w:0.90, ph:2.1} };
const EAR  = { earMoon:{amp:7, w:1.7, ph:0.4}, earStar:{amp:9, w:2.1, ph:1.9} };
const ORDER = ['base','hairO','hairR','earStar','hairL','earMoon'];

const load = src=>new Promise(r=>{ const i = new Image(); i.onload = ()=>r(i); i.src = PARTS+src; });
function tex(img, unit){
  const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  return t;
}
const VS = `attribute vec2 p, uv, ip; varying vec2 v, w; uniform vec2 res;
  void main(){ v = uv; w = ip; gl_Position = vec4(p.x/res.x*2.-1., 1.-p.y/res.y*2., 0., 1.); }`;
const FS = `precision mediump float; varying vec2 v, w;   // v: 레이어 그림 좌표, w: 원화 전체 좌표(마스크·패치용)
  uniform sampler2D img, msk, eye, smT, frT; uniform vec4 eyeR, smR, frR; uniform float blink, smile, frown, face; uniform vec3 stage;
  vec3 patch(vec3 c, float a, sampler2D t, vec4 r, float k){
    vec2 e = (w - r.xy) / r.zw;
    if(k <= 0. || e.x < 0. || e.y < 0. || e.x > 1. || e.y > 1.) return c;
    vec4 q = texture2D(t, e); return mix(c, q.rgb / max(q.a, .001) * a, q.a * k); }
  void main(){
    vec4 c = texture2D(img, v);
    if(face > 0.){ c.rgb = patch(c.rgb, c.a, frT, frR, frown); c.rgb = patch(c.rgb, c.a, smT, smR, smile); c.rgb = patch(c.rgb, c.a, eye, eyeR, blink); }
    vec3 m = texture2D(msk, w).rgb;                    // r=손톱 g=머리 b=눈
    float g = max(max(m.r*(1.-stage.x), m.g*(1.-stage.y)), m.b*(1.-stage.z));
    float l = dot(c.rgb, vec3(.299,.587,.114));
    gl_FragColor = vec4(mix(c.rgb, vec3(l*1.05), g), c.a);
  }`;
function program(){
  const sh = (t,s)=>{ const o = gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER,VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(p); gl.useProgram(p); return p;
}

// 레이어마다 격자 그물 (rest: 원화 좌표)
function mesh(name, nx, ny){
  const {xy:[x0,y0], size:[w,h]} = L[name], rest = [], uv = [], ip = [], idx = [];
  for(let j=0;j<=ny;j++) for(let i=0;i<=nx;i++){
    const x = x0 + i/nx*w, y = y0 + j/ny*h; rest.push(x, y); uv.push(i/nx, j/ny); ip.push(x/IW, y/IH); }
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const a = j*(nx+1)+i, b = a+1, c = a+nx+1, d = c+1; idx.push(a,b,c, b,d,c); }
  const buf = d=>{ const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d), gl.STATIC_DRAW); return b; };
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  return {name, rest, pos:new Float32Array(rest.length), uv:buf(uv), ip:buf(ip), ib, n:idx.length, pb:gl.createBuffer()};
}

// 관성: 기울기·문지르기로 생긴 흔들림이 스프링처럼 출렁이다 가라앉는다
const wind = {x:0, v:0, target:0};
let lastPX = null;
addEventListener('pointermove', e=>{ if(lastPX!=null) wind.v += (e.clientX-lastPX) * .9; lastPX = e.clientX; });
addEventListener('pointerleave', ()=>{ lastPX = null; });
addEventListener('deviceorientation', e=>{ if(e.gamma==null) return; wind.target = Math.max(-1, Math.min(1, e.gamma/25)) * 22; });
function stepWind(dt){
  const k = 38, damp = 3.2;
  wind.v += ((wind.target - wind.x)*k - wind.v*damp) * dt; wind.x += wind.v * dt;
  wind.v = Math.max(-260, Math.min(260, wind.v)); wind.x = Math.max(-28, Math.min(28, wind.x));   // 너무 세게 흔들리지 않게
}

function breathAt(t){ return (Math.sin(t*1.25)*.5+.5) * 6; }          // px
function breathW(y){ return 1 - sm(1300, 1950, y); }
function blinkAt(t){ const p = t % 4.7, d = .17; return p < d ? Math.sin(p/d*Math.PI) : 0; }

function poseBase(m, t){
  const br = breathAt(t), bi = Math.round(br);
  for(let k=0;k<m.rest.length;k+=2){ const y = m.rest[k+1], w = breathW(y);
    m.pos[k] = m.rest[k]; m.pos[k+1] = y - (w >= .999 ? bi : br*w); }      // 얼굴 쪽은 정수 픽셀로만 옮겨 선명하게
}
function poseHair(m, t, cfg){
  const {root:[, ry], xy:[, y0], size:[, h]} = L[m.name], len = y0 + h - ry, bi = Math.round(breathAt(t));
  for(let k=0;k<m.rest.length;k+=2){
    const x = m.rest[k], y = m.rest[k+1], s = Math.max(0, (y-ry)/len);
    const wave = Math.sin(t*cfg.w*1.6 - s*2.6 + cfg.ph)*cfg.amp*Math.pow(s,1.5)
               + Math.sin(t*cfg.w*3.7 - s*5 + cfg.ph*2)*cfg.amp*.18*Math.pow(s,2)
               + wind.x*Math.pow(s,1.3)*(cfg.amp/22);
    const dy = -.5*wave*wave/(y-ry+60);                                      // 길이 유지: 옆으로 갈수록 살짝 올라간다
    m.pos[k] = x + wave; m.pos[k+1] = y + dy - bi;
  }
}
function poseEar(m, t, cfg){
  const {root:[rx, ry]} = L[m.name], bi = Math.round(breathAt(t));
  const deg = Math.max(-16, Math.min(16, Math.sin(t*cfg.w*1.6 + cfg.ph)*cfg.amp - wind.x*.35));
  const a = deg * Math.PI/180, c = Math.cos(a), s = Math.sin(a);
  for(let k=0;k<m.rest.length;k+=2){ const dx = m.rest[k]-rx, dy = m.rest[k+1]-ry;
    m.pos[k] = rx + dx*c - dy*s; m.pos[k+1] = ry + dx*s + dy*c - bi; }
}

let P, U, M = {}, T = {}, lastT = null;
function draw(t, stage){
  stepWind(lastT == null ? 0 : Math.min(.05, Math.max(0, t-lastT))); lastT = t;
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  // 단계: 0~.25 눈, .25~.5 머리, .5~.75 손톱 순서로 색이 돌아온다. 석고 단계는 눈을 감는다
  gl.uniform3f(U.stage, sm(.5,.75,stage), sm(.25,.5,stage), sm(0,.25,stage));
  gl.uniform1f(U.blink, Math.max(1 - sm(.12,.25,stage), blinkAt(t)));
  gl.uniform1f(U.smile, EXPR==='smile'?1:0); gl.uniform1f(U.frown, EXPR==='frown'?1:0);
  for(const name of ORDER){
    const m = M[name];
    if(name === 'base') poseBase(m, t); else if(HAIR[name]) poseHair(m, t, HAIR[name]); else poseEar(m, t, EAR[name]);
    gl.uniform1f(U.face, name === 'base' ? 1 : 0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T[name]);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.pb); gl.bufferData(gl.ARRAY_BUFFER, m.pos, gl.DYNAMIC_DRAW); gl.vertexAttribPointer(U.p, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.uv); gl.vertexAttribPointer(U.uv, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.ip); gl.vertexAttribPointer(U.ip, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ib); gl.drawElements(gl.TRIANGLES, m.n, gl.UNSIGNED_SHORT, 0);
  }
}

(async ()=>{
  [META, L] = await Promise.all(['parts.json','layers.json'].map(f=>fetch(PARTS+f).then(r=>r.json())));
  [IW, IH] = META.size;
  const names = ORDER.concat(['mask','eyes_closed','mouth_smile','face_frown']);
  const imgs = Object.fromEntries(await Promise.all(names.map(async n=>[n, await load(n+'.webp')])));
  cv.width = IW; cv.height = IH; gl.viewport(0,0,IW,IH);
  P = program(); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  U = {p:gl.getAttribLocation(P,'p'), uv:gl.getAttribLocation(P,'uv'), ip:gl.getAttribLocation(P,'ip')};
  [U.p, U.uv, U.ip].forEach(a=>gl.enableVertexAttribArray(a));
  for(const n of ['res','img','msk','eye','smT','frT','eyeR','smR','frR','blink','smile','frown','face','stage']) U[n] = gl.getUniformLocation(P,n);
  ORDER.forEach(n=>{ T[n] = tex(imgs[n], 0); });
  tex(imgs.mask,1); tex(imgs.eyes_closed,2); tex(imgs.mouth_smile,3); tex(imgs.face_frown,4);
  ['img','msk','eye','smT','frT'].forEach((n,i)=>gl.uniform1i(U[n], i)); gl.uniform2f(U.res, IW, IH);
  const rect = (u, im, [x, y])=>gl.uniform4f(u, x/IW, y/IH, im.naturalWidth/IW, im.naturalHeight/IH);
  rect(U.eyeR, imgs.eyes_closed, META.patches.eyes_closed); rect(U.smR, imgs.mouth_smile, META.patches.mouth_smile); rect(U.frR, imgs.face_frown, META.patches.face_frown);
  M.base = mesh('base', 16, 32);
  for(const n of Object.keys(HAIR)) M[n] = mesh(n, 10, 48);
  for(const n of Object.keys(EAR)) M[n] = mesh(n, 2, 2);
  const sl = document.getElementById('stage'), sv = document.getElementById('sv');
  document.getElementById('ex').onchange = e=>{ EXPR = e.target.value; };
  window.renderAt = (t, s, ex, w)=>{ EXPR = ex || ''; if(w!=null){ wind.v += w; } draw(t, s); return cv.toDataURL('image/png'); };
  window.ready = true;
  if(location.hash === '#still') return;
  const loop = ms=>{ sv.textContent = (+sl.value).toFixed(2); draw(ms/1000, +sl.value); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script></body></html>
