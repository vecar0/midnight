<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Céleste rig</title>
<style>
  html,body{margin:0;height:100%;background:#eeeeea;font:13px/1.4 system-ui,sans-serif;color:#111;overflow:hidden}
  #c{display:block;height:100vh;width:auto;margin:0 auto;touch-action:none}
  #ui{position:fixed;left:12px;bottom:12px;background:#fffc;padding:8px 10px;border:1px solid #111}
  #ui input{width:150px;vertical-align:middle}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">단계 <input id="stage" type="range" min="0" max="1" step="0.001" value="1"> <span id="sv">1.00</span>
  표정 <select id="ex"><option value="">기본</option><option value="smile">완주(미소)</option><option value="frown">포기(찡그림)</option></select></div>
<script src="rig.js"></script>
<script>
(async ()=>{
  const cv = document.getElementById('c');
  const rig = await CelesteRig(cv, {capture:true});
  const sl = document.getElementById('stage'), sv = document.getElementById('sv');
  document.getElementById('ex').onchange = e=>{ rig.expr = e.target.value; };
  // 확인·캡처용
  Object.assign(window, {rig, S:rig.S, get STR(){ return rig.STR; }, get ORDER(){ return rig.ORDER; },
    draw:(t, s)=>rig.draw(t, s), seed:s=>rig.seed(s)});
  Object.defineProperty(window, 'ONLY', {set(v){ rig.only = v; }, get(){ return rig.only; }});
  window.renderAt = (t, s, ex, ptr, tap)=>{ rig.expr = ex || ''; if(ptr) rig.point(ptr[0], ptr[1]); if(tap) rig.tap(); rig.draw(t, s); return cv.toDataURL('image/png'); };
  window.ready = true;
  if(location.hash === '#still') return;
  const loop = ms=>{ sv.textContent = (+sl.value).toFixed(2); rig.draw(ms/1000, +sl.value); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script></body></html>
