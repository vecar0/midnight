<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Minuit</title>
<meta name="theme-color" content="#030304">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minuit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f1efe9; --mut:#aeaaa0; --dim:#77746c; --line:rgba(241,239,233,.16); --line2:rgba(241,239,233,.36);
  --fell:"IM Fell English","Cormorant Garamond","Times New Roman",serif;
  --fellsc:"IM Fell English SC","IM Fell English",serif;
  --title:"Song Myung","Nanum Myeongjo","AppleMyungjo",serif;
  --kr:"Nanum Myeongjo","AppleMyungjo","Song Myung",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#030304;color:var(--ink);font-family:var(--kr);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ══════ 무대 ══════ */
.stage{position:fixed;left:0;right:0;top:0;height:100%;height:100lvh;min-height:calc(100% + env(safe-area-inset-bottom));overflow:hidden}
html{background:#040405}
#bg{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;object-position:50% 70%;
  transition:filter 1.2s;will-change:transform}
#orbs{position:absolute;inset:0;pointer-events:none;z-index:3}
#orbs img{position:absolute;will-change:transform,opacity;mix-blend-mode:screen}
body.scene-on #bg{filter:brightness(.82)}
.vign{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.72) 100%)}

/* 종이 콜라주 오브젝트 */
.obj{position:absolute;z-index:2;visibility:hidden;transform-origin:50% 50%;pointer-events:none}
.obj img{display:block;width:100%;height:auto;filter:drop-shadow(4px 10px 14px rgba(0,0,0,.55))}
.obj.float img{animation:bob var(--bd,6s) ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-4%) rotate(-2deg)}to{transform:translateY(4%) rotate(2deg)}}
.crease{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:0;
  background-size:cover;-webkit-mask-size:100% 100%;mask-size:100% 100%}

/* 그녀 */
.figbox{position:absolute;z-index:4;will-change:transform;pointer-events:none;left:0;right:0;bottom:0;top:calc(46px + env(safe-area-inset-top))}
.fig{position:absolute;left:50%;bottom:0;visibility:hidden}
#figbox{overflow:visible}
.fig[hidden]{display:none}
.fig>*{position:absolute;inset:0;width:100%;height:100%}
.fig canvas.sand{inset:auto;image-rendering:auto}
.fig .who{opacity:0;filter:drop-shadow(10px 22px 26px rgba(0,0,0,.7)) drop-shadow(0 0 1px rgba(0,0,0,.6))}
.fig svg{pointer-events:none}
#stream,#streamL{animation:grain .45s linear infinite}
@keyframes grain{to{stroke-dashoffset:-28}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* ══════ 팝업 UI (위) ══════ */
.panel{position:fixed;z-index:10;left:50%;top:calc(10px + env(safe-area-inset-top));
  width:min(94vw,440px);transform:translateX(-50%);touch-action:none;
  padding:16px 18px 8px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)),rgba(6,6,7,.72);
  backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px) saturate(1.1);
  box-shadow:0 30px 70px rgba(0,0,0,.65),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04);
  max-height:calc(100% - 20px - env(safe-area-inset-top));overflow-y:auto;
  transition:transform .55s cubic-bezier(.3,.9,.3,1),opacity .4s;
  transform:perspective(1000px) translateX(-50%) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  }
/* 두께 있는 유리판: 윗면 빛, 아랫면 그림자, 기울기에 따라 움직이는 반사광 */
body.scene-on .panel{transform:perspective(1000px) translateX(-50%) translateY(calc(-100% - 40px)) rotateX(35deg);opacity:0;pointer-events:none}
.panel.drag{transition:none}
.chap{display:flex;align-items:center;justify-content:space-between}
.chap .t{display:flex;align-items:baseline;gap:10px}
.chap .num{font-family:var(--fellsc);font-size:26px;line-height:1;color:#fff;min-width:22px}
.chap .nm{font-family:var(--fell);font-style:italic;font-size:21px;letter-spacing:.5px}
.chap .nm small{font-family:var(--title);font-style:normal;font-size:12px;color:var(--mut);margin-left:8px;letter-spacing:2px}
.pips{display:flex;gap:7px}
.pips i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--line2);transition:.6s}
.pips i.on{background:#fff;border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
.time{margin-top:8px}
.time .t{font-family:var(--fell);font-size:clamp(60px,17vw,76px);line-height:.95;letter-spacing:1px;color:#fff;
  text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.7),0 10px 26px rgba(0,0,0,.7)!important;
  font-variant-numeric:lining-nums tabular-nums;text-shadow:0 0 28px rgba(255,255,255,.18)}
.time .t b{font-weight:400;color:var(--dim);padding:0 2px}
.time .s{margin-top:6px;font-size:13px;color:var(--mut);min-height:18px}
.rule{display:flex;align-items:center;gap:10px;margin:12px 0 10px;color:var(--dim)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.rule i{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--line2)}
.gown .tr{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.gown .tr i{height:2px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.gown .tr i::after{content:"";position:absolute;inset:0;width:var(--f,0%);background:#fff;box-shadow:0 0 8px #fff;transition:width .6s}
.gown .lb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px}
.gown .lb span{font-family:var(--fell);font-style:italic;font-size:14px;color:var(--dim);text-align:center;transition:color .5s}
.gown .lb span.on{color:#fff}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:14px;
  background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;color:var(--mut);cursor:pointer;
  padding:9px 0 8px;border-radius:11px;font-family:var(--fell);font-size:21px;transition:.2s}
.seg button small{font-family:var(--kr);font-size:10px;margin-left:2px;opacity:.7}
.seg button[aria-pressed="true"]{background:#f1efe9;color:#0a0a0b}
.controls{display:flex;gap:8px;margin-top:9px}
.primary:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 1px 0 #fff!important}
.primary{flex:1;height:52px;transition:transform .12s;border:0;border-radius:14px;cursor:pointer;font-family:var(--title);font-size:17px;
  letter-spacing:2px;color:#0a0a0b;background:linear-gradient(180deg,#fff,#d9d6cf);box-shadow:0 6px 22px rgba(255,255,255,.1),inset 0 1px 0 #fff}
.primary.run{background:transparent;color:#fff;border:1px solid var(--line2);box-shadow:none}
.ghost{flex:0 0 74px;border-radius:14px;cursor:pointer;font-family:var(--title);font-size:15px;color:var(--mut);background:transparent;border:1px solid var(--line)}
.expand{width:100%;margin-top:6px;background:none;border:0;color:var(--dim);font-size:12.5px;cursor:pointer;padding:8px}
.more{border-top:1px solid var(--line);padding-top:12px}
.more[hidden]{display:none}
.lbl{font-family:var(--title);font-size:13px;color:var(--mut);margin-bottom:8px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.chip{padding:10px 3px;border-radius:10px;font-size:13px;color:var(--mut);background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.14);border-color:#fff;color:#fff}
.vol{display:flex;align-items:center;gap:10px;margin-top:10px}
.vol span{font-size:12px;color:var(--dim)}
input[type=range]{flex:1;accent-color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:12px}
.stat{text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 3px}
.stat small{display:block;font-size:11px;color:var(--dim)}
.stat b{display:block;margin-top:2px;font-family:var(--fell);font-weight:400;font-size:21px;color:#fff}
.foot{margin-top:11px;display:flex;gap:6px;justify-content:center}
.link{background:none;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:8px 14px;border-radius:99px;cursor:pointer}
.grab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 4px;cursor:grab;color:var(--dim);font-size:11.5px;user-select:none}
.grab i{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.handle{position:fixed;z-index:9;left:50%;top:calc(8px + env(safe-area-inset-top));
  transform:translateX(-50%) translateY(-160%);opacity:0;touch-action:none;
  display:flex;align-items:center;gap:10px;padding:6px 16px 6px 18px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:rgba(6,6,7,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .5s cubic-bezier(.3,.9,.3,1) .15s,opacity .4s .15s}
body.scene-on .handle{transform:translateX(-50%);opacity:1}
.handle .t{font-family:var(--fell);font-size:24px;line-height:1;color:#fff;font-variant-numeric:lining-nums tabular-nums}
.handle .c{font-size:11px;color:var(--mut)}

@media (orientation:landscape) and (max-height:640px){
  .panel{width:min(62vw,520px);padding:12px 16px 6px}
  .time{display:flex;align-items:baseline;gap:14px;margin-top:4px}
  .time .t{font-size:54px}
  .rule{margin:6px 0 8px}
  .seg{margin-top:10px}
  .stats{display:none}
  .grab{padding:4px 0 2px}.grab span,.grab>i{display:none}
  .figbox{top:calc(40px + env(safe-area-inset-top))}
}

.sheetpop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:26px}
.sheetpop.on{display:flex}
.sheetpop .box{background:#0d0d0e;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:330px;font-size:14px;line-height:1.75}
.sheetpop h3{margin:0 0 9px;font-family:var(--title);font-weight:400;font-size:18px}
.sheetpop p{margin:0 0 9px;color:var(--mut);font-size:13px}
.sheetpop ol{margin:0 0 15px;padding-left:18px}
.sheetpop .ok{width:100%;padding:13px;border:0;border-radius:12px;background:#f1efe9;color:#0a0a0b;font-family:var(--title);font-size:15px;cursor:pointer}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#fff,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;z-index:8;transition:opacity .9s}
#flash.on{opacity:.5;transition:opacity .06s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:11;
  transform:translateX(-50%) translateY(14px);opacity:0;visibility:hidden;background:#0d0d0e;color:#fff;
  border:1px solid var(--line2);font-family:var(--title);font-size:14px;padding:10px 18px;border-radius:99px;
  transition:transform .35s,opacity .25s,visibility 0s .35s}
.toast.on{transform:translateX(-50%);opacity:1;visibility:visible;transition:transform .35s,opacity .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 종이 팝업: 아이보리 종이 위에 잉크 글씨 ── */
.panel{touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;isolation:isolate;--ink:#1f1b17;--mut:#5b5249;--dim:#8a7f73;--line:rgba(40,30,20,.18);--line2:rgba(40,30,20,.38);
  color:var(--ink);background:transparent center/100% 100% no-repeat;border:0;border-radius:0;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;padding:30px 30px 16px;
  filter:drop-shadow(0 22px 28px rgba(0,0,0,.6)) drop-shadow(0 4px 8px rgba(0,0,0,.4));
  transition:opacity .25s}
body.scene-on .panel{transform:perspective(1000px) translateX(-50%);visibility:hidden;opacity:0}
body.panel-anim .panel{visibility:hidden}
.chap .num{color:var(--ink)!important}
.time .t{color:var(--ink)!important;text-shadow:0 1px 0 rgba(255,255,255,.7),0 -1px 0 rgba(0,0,0,.15)!important}
.time .t b{color:var(--dim)}
.pips i.on{background:var(--ink);border-color:var(--ink);box-shadow:none}
.gown .tr i{background:rgba(40,30,20,.14)}
.gown .tr i::after{background:var(--ink);box-shadow:none}
.gown .lb span.on{color:var(--ink)}
.seg{background:rgba(40,30,20,.06)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#f3ede2}
.primary{background:linear-gradient(180deg,#2b2520,#15110e);color:#f3ede2;box-shadow:0 4px 0 #000,0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.primary:active{transform:translateY(3px)!important;box-shadow:0 1px 0 #000,0 3px 8px rgba(0,0,0,.3)!important}
.primary.run{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.stat b{color:var(--ink)}
.link{color:var(--mut)}
.link[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.subj{margin-top:12px}
.subj input{width:100%;box-sizing:border-box;font-family:var(--title);font-size:16px;color:var(--ink);background:rgba(255,255,255,.35);
  border:0;border-bottom:1.5px solid var(--line2);padding:9px 4px 7px;outline:none;border-radius:4px 4px 0 0}
.subj input::placeholder{color:var(--dim)}
.subj input:focus{background:rgba(255,255,255,.55);border-color:var(--ink)}
.subj input:disabled{opacity:.7}
.recent{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.recent button{font-family:var(--title);font-size:12px;color:var(--mut);background:rgba(40,30,20,.05);border:1px solid var(--line);
  border-radius:99px;padding:4px 10px;cursor:pointer}
.bars{margin-top:10px;display:grid;gap:6px}
.bars .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px}
.bars .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--title)}
.bars .r b{font-family:var(--fell);font-weight:400;font-size:15px}
.bars .r i{grid-column:1/-1;height:3px;background:rgba(40,30,20,.1);position:relative}
.bars .r i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--ink)}
.hist{margin-top:6px;display:grid;gap:2px;font-size:12.5px;color:var(--mut)}
.hist div{display:grid;grid-template-columns:44px minmax(0,1fr) auto 18px;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.hist div span:nth-child(2){color:var(--ink);font-family:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .none{display:block;border:0;color:var(--dim)}
.handle{background:transparent center/cover no-repeat;border:0;border-radius:6px;padding:9px 20px 9px 22px;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.6));backdrop-filter:none;-webkit-backdrop-filter:none}
.handle .s{font-family:var(--title);font-size:12px;color:#d9d2c6;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 테두리 종이·시계 바늘 */
.edge{position:absolute;pointer-events:none;opacity:0;transition:opacity .9s;will-change:transform}
body.scene-on .edge{opacity:1;transition:opacity 1.2s .5s}
.hands{position:absolute;left:0;top:0;width:200px;height:200px;transform-origin:0 0;pointer-events:none}
.hands img{position:absolute;will-change:transform;filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.5))}
.handle{white-space:nowrap}
.handle .c{white-space:nowrap}
.foot{flex-wrap:wrap}
.foot .link{white-space:nowrap;font-size:11.5px;padding:7px 11px}
@media (orientation:landscape) and (max-height:640px){
  .panel{padding:22px 26px 10px;max-height:calc(100% - 16px)}
  .panel .gown,.panel .rule{display:none}
  .subj{margin-top:8px} .subj input{padding:6px 4px 5px;font-size:15px}
  .seg{margin-top:8px} .seg button{padding:6px 0}
  .primary{height:44px}
  .grab span,.grab>i{display:none}
}
/* 입체 오브젝트: 캐릭터 앞뒤로 떠 있다 */
.l3d{position:absolute;inset:0;pointer-events:none}
.f3{position:absolute;left:0;top:0;will-change:transform;opacity:0;transition:opacity .8s}
.f3 img{display:block;width:100%;height:auto;opacity:0;transform:scale(.4) rotate(-25deg);
  transition:transform .9s cubic-bezier(.2,1.3,.4,1),opacity .6s;animation:bob var(--d,6s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
body.scene-on .f3{opacity:1}
body.scene-on .f3 img{opacity:1;transform:none;transition-delay:var(--in,.6s)}
#back3d .f3 img{filter:drop-shadow(6px 14px 10px rgba(0,0,0,.55)) brightness(.82) blur(.3px)}
#front3d .f3 img{filter:drop-shadow(10px 22px 16px rgba(0,0,0,.6)) drop-shadow(0 0 1px rgba(255,255,255,.3))}
@keyframes bob{from{translate:0 -4%;rotate:-4deg}to{translate:0 5%;rotate:5deg}}
#curtain{position:absolute;right:0;top:-10vh;height:120vh;width:auto;z-index:6;pointer-events:none;
  transform:translateX(105%);transition:transform .68s cubic-bezier(.65,0,.25,1);filter:drop-shadow(-18px 0 26px rgba(0,0,0,.6))}
#curtain.on{transform:translateX(0);transition:transform .7s cubic-bezier(.2,.9,.25,1)}
@media (orientation:portrait){ #curtain{top:0;height:100%} }
/* 회전 중엔 잠깐 가렸다가 새 배치로 */
.stage,.handle{transition:opacity .2s}
body.reflow .stage,body.reflow .handle,body.reflow .panel{opacity:0!important;transition:none}
</style>
</head>
<body>


<div class="stage">
  <img id="bg" alt="">
  <div id="objs"></div>
  <div id="orbs"></div>
  <img class="edge" id="edgeBot" alt="">
  <div class="vign"></div>
  <div id="back3d" class="l3d" style="z-index:3"></div>
  <div class="figbox" id="figbox">
    <div class="fig" id="figP"></div>
    <div class="fig" id="figL" hidden></div>
  </div>
  <img class="edge" id="edgeR" alt="" style="z-index:5">
  <img class="edge" id="edgeB2" alt="" style="z-index:5">
  <img id="curtain" alt="" decoding="async">
  <canvas id="tx" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7"></canvas>
  <div id="front3d" class="l3d" style="z-index:5"></div>
  <canvas id="fx"></canvas>
</div>

<div class="panel" id="panel">
  <div class="chap">
    <div class="t"><span class="num" id="chapNum">I</span><span class="nm" id="stepTxt">Prélude<small>서곡</small></span></div>
    <div class="pips" id="pips"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="time">
    <div class="t" id="tTime">25<b>:</b>00</div>
    <div class="s" id="tStatus">시간을 고르고 시작하세요</div>
  </div>
  <div class="rule"><i></i></div>
  <div class="gown">
    <div class="tr"><i id="g1"></i><i id="g2"></i><i id="g3"></i><i id="g4"></i></div>
    <div class="lb" id="gLb"><span>Prélude</span><span>Nocturne</span><span>Valse</span><span>Minuit</span></div>
  </div>
  <div class="subj"><input id="subject" maxlength="24" placeholder="무엇에 집중할까요?" autocomplete="off"><div class="recent" id="recentSubj"></div></div>
  <div class="seg" id="presets"></div>
  <div class="controls">
    <button class="primary" id="go">집중 시작</button>
    <button class="ghost" id="stopBtn">그만</button>
  </div>
  <button class="expand" id="expand">기록 ▾</button>
  <div class="more" id="more" hidden>

    'M'+(cx-W*.6)+','+(mid+W*.45)+' Q'+(cx-W*.95)+','+((mid+bot)/2)+' '+(cx-W*.5)+','+(bot-W*.25)+' Q'+(cx-W*.78)+','+((mid+bot)/2)+' '+(cx-W*.48)+','+(mid+W*.5)+'Z');

/* ═══ 변신: 서곡 → 야상곡 → 왈츠 → 자정 ═══ */
const STEPS = [{n:'Prélude',k:'서곡',r:'I'},{n:'Nocturne',k:'야상곡',r:'II'},{n:'Valse',k:'왈츠',r:'III'},{n:'Minuit',k:'자정',r:'IV'}];
let lastStep = -1, curIdx = 0;
function applyBlend(p){
  // 세 벌은 구간마다, 마지막 드레스는 자정(완주)에 — 옷이 바뀔 땐 종이처럼 구겨졌다 펴진다
  const s = Math.min(3, Math.floor(p*4));          // 시간을 4등분해서 한 벌씩
  if(s === lastStep) return;
  const first = lastStep < 0; lastStep = s;
  $('chapNum').textContent = STEPS[s].r; $('stepTxt').innerHTML = STEPS[s].n+'<small>'+STEPS[s].k+'</small>';
  document.querySelectorAll('#pips i').forEach((e,k)=> e.classList.toggle('on', k<=s));
  document.querySelectorAll('#gLb span').forEach((e,k)=> e.classList.toggle('on', k===s));
  const f = curFig();
  if(!first && sceneOn && !tx.items.has(f) && f.style.visibility==='visible') curtainSwap(s);
  else showOutfit(s);
}
/* ═══ 모래 ═══ */
const lut = (a,x) => { const f = Math.max(0,Math.min(1,x))*(a.length-1), i = Math.min(a.length-2, f|0); return a[i] + (a[i+1]-a[i])*(f-i); };
let lastR = 1;
/* 모래: 알갱이 하나하나가 중력으로 떨어지고, 비어 있는 아래·대각선 아래로 미끄러지며 쌓인다.
   목(가장 좁은 곳)은 타이머 속도에 맞춰 알갱이를 한 톨씩 통과시킨다. */
const SIM = {};
function simInit(key, idx, p){
  const g = G[key][idx], el = $('fig'+key), [w,h] = SIZE[key];
  const m0 = g.path.match(/M\s*([-\d.]+),([-\d.]+)/), yt = +m0[2];
  const COLS = 48, x0 = g.cx - g.W - 3, cell = (2*g.W + 6)/COLS, rows = Math.ceil((g.floor - yt + 6)/cell), y0 = yt - 3;
  const oc = document.createElement('canvas'); oc.width = COLS; oc.height = rows; const ox = oc.getContext('2d');
  ox.setTransform(1/cell,0,0,1/cell,-x0/cell,-y0/cell); ox.fill(new Path2D(g.path));
  const al = ox.getImageData(0,0,COLS,rows).data, mask = new Uint8Array(COLS*rows);
  for(let i=0;i<mask.length;i++) mask[i] = al[i*4+3] > 140 ? 1 : 0;
  const gate = Math.round((g.neck - y0)/cell);
  for(let c=0;c<COLS;c++) if(mask[gate*COLS+c]) mask[gate*COLS+c] = 2;           // 목: 평소엔 막혀 있다
  const topFull = Math.round((yt + (g.neck-yt)*.2 - y0)/cell);
  let N = 0; for(let r=topFull;r<gate;r++) for(let c=0;c<COLS;c++) if(mask[r*COLS+c]===1) N++;
  const cv = el.querySelector('canvas.sand'); cv.width = COLS*2; cv.height = rows*2;
  Object.assign(cv.style,{left:(x0/w*100)+'%', top:(y0/h*100)+'%', width:(COLS*cell/w*100)+'%', height:(rows*cell/h*100)+'%'});
  const S = SIM[key] = {key, idx, COLS, rows, mask, gate, N, grid:new Uint8Array(COLS*rows), mv:new Uint8Array(COLS*rows),
    passed:0, cv, cx:cv.getContext('2d'), img:null, cell, x0, y0, g, dir:1};
  S.img = S.cx.createImageData(COLS*2, rows*2);

}
function simFill(S, p){                                   // 진행률에 맞춰 위·아래에 곧바로 채워 둔다
  const {COLS, rows, mask, gate, grid} = S; grid.fill(0);
  let top = Math.round((1-p)*S.N), bot = S.N - top; S.passed = bot;
  const put = (r, n)=>{ const cs=[]; for(let c=0;c<COLS;c++) if(mask[r*COLS+c]===1) cs.push(c);
    const mid = COLS/2; cs.sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid)); let k=0;
    for(; k<cs.length && k<n; k++) grid[r*COLS+cs[k]] = 150 + (Math.random()*105|0); return k; };
  for(let r=gate-1; r>=0 && top>0; r--) top -= put(r, top);
  // 아래는 가운데가 높은 더미 모양으로
  const cap = []; for(let r=rows-1;r>gate;r--) cap.push(r);
  let layer = 0;
  while(bot>0 && layer<cap.length){ const r = cap[layer];
    const cs=[]; for(let c=0;c<COLS;c++) if(mask[r*COLS+c]===1) cs.push(c);
    const lim = Math.max(1, Math.ceil(cs.length*(1 - layer/(cap.length*1.05))));
    const mid=COLS/2; cs.sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid));
    for(let k=0;k<cs.length && k<lim && bot>0;k++,bot--) grid[r*COLS+cs[k]] = 150 + (Math.random()*105|0);
    layer++; }
}
function simStep(S, target){
  const {COLS, rows, mask, grid, mv, gate} = S; mv.fill(0);
  // 1) 목을 통과시키기: 목 바로 위의 가운데 알갱이를 한 톨씩 아래로
  let rel = 0;
  while(S.passed < target && rel < 3){ let got = -1;
    for(let r=gate-1; r>=Math.max(0,gate-10) && got<0; r--) for(let d=0; d<=6 && got<0; d++) for(const c of [COLS/2-1-d|0, COLS/2+d|0]){
      const i=r*COLS+c; if(c>=0&&c<COLS&&grid[i]){ got=i; break; } }
    const drop = (gate+1)*COLS + (COLS/2|0) - (Math.random()<.5?1:0);
    if(got<0 || grid[drop] || mask[drop]!==1) break;
    grid[drop] = grid[got]; grid[got] = 0; S.passed++; rel++; }
  if(S.passed > target && target===0) simFill(S,0);
  // 2) 중력: 아래가 비면 떨어지고, 막히면 대각선 아래로 미끄러진다 (좌우 번갈아 훑어 치우침 없게)
  S.dir = -S.dir;
  for(let r=rows-2; r>=0; r--){
    for(let k=0;k<COLS;k++){ const c = S.dir>0 ? k : COLS-1-k, i = r*COLS+c;
      if(!grid[i] || mv[i]) continue;
      const b = i+COLS;
      if(mask[b]===1 && !grid[b]){ grid[b]=grid[i]; grid[i]=0; mv[b]=1; continue; }
      const L = c>0 ? b-1 : -1, R = c<COLS-1 ? b+1 : -1, first = Math.random()<.5;
      const tryMove = t=> t>=0 && mask[t]===1 && !grid[t] && mask[t-COLS]!==0;
      const a1 = first?L:R, a2 = first?R:L;
      if(tryMove(a1)){ grid[a1]=grid[i]; grid[i]=0; mv[a1]=1; }
      else if(tryMove(a2)){ grid[a2]=grid[i]; grid[i]=0; mv[a2]=1; }
    } }
}
function simDraw(S){
  const {COLS, rows, grid, img} = S, d = img.data, W2 = COLS*2; d.fill(0);
  for(let r=0;r<rows;r++) for(let c=0;c<COLS;c++){ const v = grid[r*COLS+c]; if(!v) continue;
    // 위가 비어 있으면(표면) 조금 밝게, 옆이 비면 조금 어둡게
    const surf = r>0 && !grid[(r-1)*COLS+c] ? 14 : 0, side = (c>0&&!grid[r*COLS+c-1]) || (c<COLS-1&&!grid[r*COLS+c+1]) ? -18 : 0;
    const k = v/255, R = Math.min(255,(236*k + 20 + surf + side)), G2 = Math.min(255,(228*k + 18 + surf + side)), B = Math.min(255,(212*k + 14 + surf + side));
    for(let yy=0;yy<2;yy++) for(let xx=0;xx<2;xx++){ const j=((r*2+yy)*W2 + c*2+xx)*4;
      const n = ((c*7+r*13+xx*3+yy*5)%9)-4;             // 알갱이 결
      d[j]=R+n; d[j+1]=G2+n; d[j+2]=B+n; d[j+3]=(xx+yy===2 && v%3===0) ? 170 : 255; } }
  S.cx.putImageData(img,0,0);
}
let simP = 0;
function paintSand(r){ lastR = r; simP = 1 - r; }
function sandLoop(){
  const key = isLand() ? 'L' : 'P';
  let S = SIM[key];
  if(!S || S.idx !== curIdx) S = simInit(key, curIdx, simP);
  const target = Math.round(simP * S.N);
  if(Math.abs(target - S.passed) > S.N*.08) simFill(S, simP);     // 크게 건너뛰면(복원·초기화) 바로 채운다
  if(sceneOn || mode==='run'){ simStep(S, target); simStep(S, target); simDraw(S); }
  const el = $('fig'+key), st = el.querySelector('.st');
  // 떨어지는 줄기: 달리는 중에만, 더미 꼭대기까지
  let peak = S.rows-1; const cc = S.COLS/2|0; for(let rr=S.gate+1; rr<S.rows; rr++) if(S.grid[rr*S.COLS+cc]){ peak = rr; break; }
  st.setAttribute('y2', (S.y0 + peak*S.cell).toFixed(1)); st.setAttribute('opacity', (mode==='run' && simP<.999) ? '.9' : '0');

  const sa = navigator.standalone===true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
  const sh = isLand() ? Math.min(screen.width,screen.height) : Math.max(screen.width,screen.height);

function layout(){
  const land = isLand(), vw = innerWidth, vh = appH();
  document.querySelector('.stage').style.height = vh+'px'; document.body.style.minHeight = vh+'px';
  $('bg').src = src(land ? 'bgL' : 'bgP');
  $('figP').hidden = land; $('figL').hidden = !land;
  Object.values(objEls).forEach(d=>{ d._in=false; d.style.display='none'; });
  LAYOUT[land?'L':'P'].forEach(([k,l,t,w,rot])=>{ if(!objEls[k]) return; objEls[k]._in=true; objEls[k].style.display='';
    const d = objEls[k]; d.style.left = l*vw/100+'px'; d.style.top = t*vh/100+'px'; d.style.width = w*vw/100+'px';
    d._rot = rot;
  });
  const fb = $('figbox').getBoundingClientRect(), key = land?'L':'P', [w,h] = SIZE[key];
  ['figP','figL'].forEach(id=>{ const f=$(id);
    if(land){ const hh = (vh - fb.top)*1.06, ww = hh*w/h;          // 아래로 살짝 넘쳐서 잘린 밑단이 안 보이게
      f.style.width = ww+'px'; f.style.height = hh+'px'; f.style.bottom = -(hh*.05)+'px';
      f.style.left = 'auto'; f.style.right = (vw*.045)+'px'; f.style.marginLeft = '0px'; }
    else { const sc = Math.min(fb.width/w, fb.height/h); f.style.width = w*sc+'px'; f.style.height = h*sc+'px';
      f.style.bottom = '0px'; f.style.left = '50%'; f.style.right = 'auto'; f.style.marginLeft = -(w*sc)/2+'px'; } });
  if(land && objEls.oWand){ const fl = $('figL'), ww = parseFloat(fl.style.width), left = vw - vw*.045 - ww;
    const d = objEls.oWand, wd = vw*.135, hd = wd*1.3;
    d.style.width = wd+'px'; d.style.left = (left - wd*.32)+'px'; d.style.top = (vh*.78 - hd*.5)+'px'; d._rot = -10; d.style.zIndex = 5; }

/* 스와이프: 팝업을 위로 → 장면, 손잡이를 아래로(또는 탭) → UI.

function swipe(el, dirUp, cb){

  const up = ()=>{ if(y0===null) return; y0=null; el.classList.remove('drag'); el.style.transform='';

  $('sheetSteps').innerHTML = isIOS ? '<li>이 페이지를 Safari로 열기</li><li>아래 공유 버튼</li><li>홈 화면에 추가</li>' : '<li>이 페이지를 Chrome으로 열기</li><li>오른쪽 위 점 세 개</li><li>홈 화면에 추가</li>';
  $('sheetPop').classList.add('on'); };
$('sheetOk').onclick=()=>$('sheetPop').classList.remove('on');
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&mode==='run') keepAwake(true); if(document.hidden) saveRec(); });

/* ═══ 시작 ═══ */
setMins(25); paintStats();
let lastLand = isLand();
let reflowT = null;
function reflow(){ document.body.classList.add('reflow'); clearTimeout(reflowT);
  reflowT = setTimeout(()=>{ const l = isLand();
    if(sceneOn){ const other = $(l?'figP':'figL'), now = curFig(); other.style.visibility='hidden'; now.style.visibility='visible'; now.style.opacity=1;
      Object.values(objEls).forEach(d=>{ if(!tx.items.has(d)){ d.style.visibility='visible'; d.style.opacity=1; } }); }
    gyroBase = null; par.x = par.y = par.tx = par.ty = 0;
    layout(); placeHands(); fit();
    requestAnimationFrame(()=>document.body.classList.remove('reflow')); }, 280); }
addEventListener('resize', reflow);
addEventListener('orientationchange', reflow);
$('edgeBot').src=src('stripH'); $('edgeB2').src=src('stripH'); $('edgeR').src=src('stripV');
$('panel').style.backgroundImage='url('+src('paperIvory')+')'; $('handle').style.backgroundImage='url('+src('paperBlack')+')';
layout(); placeHands(); fit(); loop(); requestAnimationFrame(depthLoop); requestAnimationFrame(sandLoop);
/* 빨리 열리도록: 처음엔 배경과 팝업만 그리고, 무거운 그림은 첫 화면이 뜬 뒤 차례로 불러온다 */
function hydrate(sel){ document.querySelectorAll(sel).forEach(i=>{ if(i.dataset.src){ i.src = src(i.dataset.src); delete i.dataset.src; } }); }
requestAnimationFrame(()=>setTimeout(()=>{
  hydrate('#'+(isLand()?'figL':'figP')+' img[data-src]'); hydrate('#objs img[data-src]'); hydrate('.f3 img[data-src]');
  setTimeout(()=>{ hydrate('img[data-src]'); layout(); }, 400);
}, 30));
addEventListener('load',()=>{fit();layout();});
</script>
<script>if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script>
